name: Build

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test:unit
      - name: Audit production dependencies without exceptions
        run: yarn npm audit --recursive --environment production --no-deprecations --severity high
      # Build-only braces has no patched release for GHSA-vfj7-8cjw-p6xm yet.
      # Ignore only that advisory; new advisories for braces still fail this gate.
      - name: Audit runtime and build dependencies
        run: yarn npm audit --recursive --no-deprecations --severity high --ignore 1240992
      - name: Prepare Electron sandbox for browser tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Check popup visibility, animation and player controls
        run: xvfb-run --auto-servernum yarn test:ui

  package:
    name: Package (${{ matrix.artifact }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            artifact: linux-x64
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: macos-latest
            arch: x64
            artifact: macos-x64
          - os: macos-latest
            arch: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build Windows and Linux installers
        if: runner.os != 'macOS'
        run: yarn make --arch ${{ matrix.arch }}
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: yarn package --arch ${{ matrix.arch }}
      - name: Re-sign and verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="out/YTM Desktop-darwin-${{ matrix.arch }}/YTM Desktop.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact }}
          path: out/**
          retention-days: 7
