name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.artifact }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            artifact: linux-x64
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: macos-latest
            arch: x64
            artifact: macos-x64
          - os: macos-latest
            arch: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Verify release tag matches the app version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - run: yarn install --immutable
      - name: Build Windows and Linux package
        if: runner.os != 'macOS'
        run: yarn make --arch ${{ matrix.arch }}
      - name: Build, sign, and archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          yarn package --arch "${{ matrix.arch }}"
          app="out/YTM Desktop-darwin-${{ matrix.arch }}/YTM Desktop.app"
          destination="out/make/zip/darwin/${{ matrix.arch }}"
          version="$(node -p "require('./package.json').version")"
          archive="$destination/YTM Desktop-darwin-${{ matrix.arch }}-$version.zip"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$destination"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: out/make/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const section = fs.readFileSync('docs/CHANGELOG.md', 'utf8').split(/^## /m).find(part => part.startsWith(version + ' — '));
          if (!section) throw new Error('Missing changelog entry for ' + version);
          fs.writeFileSync('release-notes.md', '## ' + section.trim() + '\n');
          NODE
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md --title "YTM Desktop ${RELEASE_TAG}"
          fi
